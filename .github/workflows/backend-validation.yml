name: Backend and Flutter validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install backend dependencies
        working-directory: functions
        run: npm install
      - name: Compile Cloud Functions
        working-directory: functions
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib
      - name: Analyze Flutter
        run: flutter analyze