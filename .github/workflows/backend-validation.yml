name: Backend and Flutter validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install backend dependencies
        working-directory: functions
        run: npm install
      - name: Compile Cloud Functions
        working-directory: functions
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Format changed backend integration files
        run: dart format lib/main.dart lib/core/backend/nutrivision_backend.dart lib/core/backend/firebase_nutrivision_data_source.dart lib/features/authentication/data/datasources/firebase_auth_remote_data_source.dart lib/features/authentication/data/repositories/auth_repository_impl.dart
      - name: Analyze Flutter
        run: flutter analyze