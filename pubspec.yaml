name: nutri_vision
description: "NutriVision AI-driven dietary health assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.1.0
  cloud_functions: ^6.1.0
  firebase_messaging: ^16.1.0
  firebase_app_check: ^0.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/core/localization/translations/
