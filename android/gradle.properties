org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Workaround: Kotlin incremental compiler crashes on Windows when the project
# and the Pub cache live on different drives (D: vs C:). Disabling incremental
# compilation avoids the cross-drive relative-path error entirely.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
